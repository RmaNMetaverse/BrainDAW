name: Mobile

on:
  push:
    tags: ['android-v*', 'ios-v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Mobile packages to build
        type: choice
        default: both
        options: [both, android, ios]
      publish:
        description: Publish verified packages from main as GitHub prereleases
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    if: startsWith(github.ref, 'refs/tags/android-v') || (github.event_name == 'workflow_dispatch' && inputs.platform != 'ios' && !startsWith(github.ref, 'refs/tags/'))
    name: Package and test Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run mobile:sync -- android
      - working-directory: mobile/android
        run: ./gradlew :app:assembleDebug :app:bundleRelease
      - name: Enable hardware acceleration for the emulator
        run: sudo chmod a+rw /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: node scripts/check-android.mjs
      - run: |
          mkdir packages
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk packages/BrainDAW-Android-debug.apk
          cp mobile/android/app/build/outputs/bundle/release/*.aab packages/BrainDAW-Android-unsigned.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Android
          path: packages/*
          if-no-files-found: error

  ios:
    if: startsWith(github.ref, 'refs/tags/ios-v') || (github.event_name == 'workflow_dispatch' && inputs.platform != 'android' && !startsWith(github.ref, 'refs/tags/'))
    name: Package and launch iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run mobile:sync -- ios
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/braindaw-ios" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Launch and package the app
        run: |
          app="$RUNNER_TEMP/braindaw-ios/Build/Products/Release-iphonesimulator/App.app"
          codesign --force --deep --sign - --timestamp=none "$app"
          device=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries | sort_by(.key) | reverse | .[].value[] | select(.name | startswith("iPhone"))][0].udid // empty')
          test -n "$device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" com.rmanmetaverse.braindaw
          sleep 3
          xcrun simctl spawn "$device" launchctl list | grep com.rmanmetaverse.braindaw
          ditto -c -k --keepParent "$app" BrainDAW-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Simulator
          path: BrainDAW-iOS-Simulator.zip
          if-no-files-found: error

  release-android:
    if: startsWith(github.ref, 'refs/tags/android-v') || (github.ref == 'refs/heads/main' && inputs.publish)
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: Android
      - run: |
          tag="android-v$(jq -r .version package.json)"
          target=(--target "$GITHUB_SHA")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag="$GITHUB_REF_NAME"; target=(--verify-tag); fi
          gh release create "$tag" BrainDAW-Android-* "${target[@]}" --prerelease \
            --title "BrainDAW Android ${tag#android-v} preview" --notes-file .github/release-notes/android.md
        env:
          GH_TOKEN: ${{ github.token }}

  release-ios:
    if: startsWith(github.ref, 'refs/tags/ios-v') || (github.ref == 'refs/heads/main' && inputs.publish)
    needs: ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: iOS-Simulator
      - run: |
          tag="ios-v$(jq -r .version package.json)"
          target=(--target "$GITHUB_SHA")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag="$GITHUB_REF_NAME"; target=(--verify-tag); fi
          gh release create "$tag" BrainDAW-iOS-Simulator.zip "${target[@]}" --prerelease \
            --title "BrainDAW iOS ${tag#ios-v} Simulator preview" --notes-file .github/release-notes/ios.md
        env:
          GH_TOKEN: ${{ github.token }}
