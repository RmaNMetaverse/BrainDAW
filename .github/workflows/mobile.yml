name: Mobile

on:
  push:
    tags: ['android-v*', 'ios-v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Mobile packages to build
        type: choice
        default: both
        options: [both, android, ios]

permissions:
  contents: read

jobs:
  android:
    if: startsWith(github.ref, 'refs/tags/android-v') || (github.event_name == 'workflow_dispatch' && inputs.platform != 'ios' && !startsWith(github.ref, 'refs/tags/'))
    name: Package and test Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run mobile:sync -- android
      - working-directory: mobile/android
        run: ./gradlew :app:assembleDebug :app:bundleRelease
      - name: Enable hardware acceleration for the emulator
        run: sudo chmod a+rw /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: node scripts/check-android.mjs
      - run: |
          mkdir packages
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk packages/BrainDAW-Android-debug.apk
          cp mobile/android/app/build/outputs/bundle/release/*.aab packages/BrainDAW-Android-unsigned.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Android
          path: packages/*
          if-no-files-found: error

  ios:
    if: startsWith(github.ref, 'refs/tags/ios-v') || (github.event_name == 'workflow_dispatch' && inputs.platform != 'android' && !startsWith(github.ref, 'refs/tags/'))
    name: Package and launch iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run mobile:sync -- ios
      - name: Boot a fresh iPhone simulator
        timeout-minutes: 4
        run: |
          runtime=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable and (.identifier | contains(".iOS-")))] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty')
          test -n "$runtime"
          device=$(xcrun simctl create "BrainDAW CI" com.apple.CoreSimulator.SimDeviceType.iPhone-16e "$runtime")
          echo "BRAINDAW_DEVICE=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/braindaw-ios" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Sign and package the Simulator app
        run: |
          app="$RUNNER_TEMP/braindaw-ios/Build/Products/Release-iphonesimulator/App.app"
          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" BrainDAW-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Simulator
          path: BrainDAW-iOS-Simulator.zip
          if-no-files-found: error
      - name: Install and launch the app
        timeout-minutes: 7
        run: |
          app="$RUNNER_TEMP/braindaw-ios/Build/Products/Release-iphonesimulator/App.app"
          deadline=$((SECONDS + 300))
          until xcrun simctl spawn "$BRAINDAW_DEVICE" launchctl list | grep 'com.apple.SpringBoard$'; do
            if (( SECONDS >= deadline )); then
              echo 'The simulator did not start SpringBoard within five minutes.' >&2
              exit 1
            fi
            sleep 5
          done
          xcrun simctl install "$BRAINDAW_DEVICE" "$app"
          xcrun simctl launch "$BRAINDAW_DEVICE" com.rmanmetaverse.braindaw
          sleep 3
          xcrun simctl spawn "$BRAINDAW_DEVICE" launchctl list | grep com.rmanmetaverse.braindaw

  release-android:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: Android
      - run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' | grep -qx false; then exit 0; fi
          gh release create "$GITHUB_REF_NAME" BrainDAW-Android-* --verify-tag --prerelease \
            --title "BrainDAW Android ${GITHUB_REF_NAME#android-v} preview" --notes-file .github/release-notes/android.md
        env:
          GH_TOKEN: ${{ github.token }}

  release-ios:
    if: startsWith(github.ref, 'refs/tags/ios-v')
    needs: ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: iOS-Simulator
      - run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' | grep -qx false; then exit 0; fi
          gh release create "$GITHUB_REF_NAME" BrainDAW-iOS-Simulator.zip --verify-tag --prerelease \
            --title "BrainDAW iOS ${GITHUB_REF_NAME#ios-v} Simulator preview" --notes-file .github/release-notes/ios.md
        env:
          GH_TOKEN: ${{ github.token }}
