name: Mobile

on:
  push:
    tags: ['android-v*', 'ios-v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Mobile packages to build
        type: choice
        default: both
        options: [both, android, ios]

permissions:
  contents: read

jobs:
  android:
    if: startsWith(github.ref, 'refs/tags/android-v') || (github.event_name == 'workflow_dispatch' && inputs.platform != 'ios' && !startsWith(github.ref, 'refs/tags/'))
    name: Package and test Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run mobile:sync -- android
      - working-directory: mobile/android
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Find the previous signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" | jq -r --arg current "$GITHUB_REF_NAME" '
            .[] | select(.draft == false and .tag_name != $current and (.tag_name | startswith("android-v")))
            | select(any(.assets[]; .name == "BrainDAW-Android.apk")) | .tag_name
          ' | sort -Vr | sed -n '1p')
          if [[ -n "$previous_tag" ]]; then
            gh release download "$previous_tag" --pattern BrainDAW-Android.apk --output "$RUNNER_TEMP/previous.apk"
          else
            # The first stable release uses a private, re-signed fixture from the last debug preview.
            gh release download android-v0.2.1 --pattern BrainDAW-Android-debug.apk --output "$RUNNER_TEMP/bootstrap.apk"
          fi
      - name: Sign and verify the GitHub APK
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
          : "${ANDROID_RELEASE_KEYSTORE:?Missing Android release keystore}"
          : "${ANDROID_RELEASE_PASSWORD:?Missing Android release keystore password}"
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/android-keystore.XXXXXX")
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$ANDROID_RELEASE_KEYSTORE" | base64 --decode > "$keystore"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          signing=(--ks "$keystore" --ks-type PKCS12 --ks-key-alias braindaw-github --ks-pass env:ANDROID_RELEASE_PASSWORD)
          expected_sha256=129978d4ff3f3aa554ef6d77b897227e1c608866ae6332eb8f7f5f6f1520ffaa
          mkdir packages
          "$apksigner" sign "${signing[@]}" --out packages/BrainDAW-Android.apk \
            mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if [[ -f "$RUNNER_TEMP/bootstrap.apk" ]]; then
            "$apksigner" sign "${signing[@]}" --out "$RUNNER_TEMP/previous.apk" "$RUNNER_TEMP/bootstrap.apk"
          fi
          for apk in "$RUNNER_TEMP/previous.apk" packages/BrainDAW-Android.apk; do
            "$apksigner" verify --print-certs "$apk" | grep -Fx "Signer #1 certificate SHA-256 digest: $expected_sha256"
          done
          if [[ "$GITHUB_REF_NAME" == android-v* ]]; then
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging packages/BrainDAW-Android.apk > "$RUNNER_TEMP/apk-badging.txt"
            grep -F " versionName='${GITHUB_REF_NAME#android-v}' " "$RUNNER_TEMP/apk-badging.txt"
          fi
          cp mobile/android/app/build/outputs/bundle/release/*.aab packages/BrainDAW-Android-unsigned.aab
      - name: Enable hardware acceleration for the emulator
        run: sudo chmod a+rw /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: node scripts/check-android-upgrade.mjs "$RUNNER_TEMP/previous.apk" packages/BrainDAW-Android.apk && node scripts/check-android.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Android
          path: packages/*
          if-no-files-found: error

  ios:
    if: startsWith(github.ref, 'refs/tags/ios-v') || (github.event_name == 'workflow_dispatch' && inputs.platform != 'android' && !startsWith(github.ref, 'refs/tags/'))
    name: Package and launch iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run mobile:sync -- ios
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/braindaw-ios" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Launch and package the app
        run: |
          app="$RUNNER_TEMP/braindaw-ios/Build/Products/Release-iphonesimulator/App.app"
          codesign --force --deep --sign - --timestamp=none "$app"
          device=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries | sort_by(.key) | reverse | .[].value[] | select(.name | startswith("iPhone"))][0].udid // empty')
          test -n "$device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" com.rmanmetaverse.braindaw
          sleep 3
          xcrun simctl spawn "$device" launchctl list | grep com.rmanmetaverse.braindaw
          ditto -c -k --keepParent "$app" BrainDAW-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Simulator
          path: BrainDAW-iOS-Simulator.zip
          if-no-files-found: error

  release-android:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: Android
      - run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' | grep -qx false; then exit 0; fi
          gh release create "$GITHUB_REF_NAME" BrainDAW-Android-* --verify-tag --prerelease \
            --title "BrainDAW Android ${GITHUB_REF_NAME#android-v} preview" --notes-file .github/release-notes/android.md
        env:
          GH_TOKEN: ${{ github.token }}

  release-ios:
    if: startsWith(github.ref, 'refs/tags/ios-v')
    needs: ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: iOS-Simulator
      - run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' | grep -qx false; then exit 0; fi
          gh release create "$GITHUB_REF_NAME" BrainDAW-iOS-Simulator.zip --verify-tag --prerelease \
            --title "BrainDAW iOS ${GITHUB_REF_NAME#ios-v} Simulator preview" --notes-file .github/release-notes/ios.md
        env:
          GH_TOKEN: ${{ github.token }}
