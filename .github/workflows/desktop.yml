name: Desktop

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-2025
            arguments: --bundles nsis,msi
          - name: macOS
            runner: macos-15
            arguments: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run tauri -- build ${{ matrix.arguments }}
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" installers/* --verify-tag --title "BrainDAW Desktop ${GITHUB_REF_NAME#desktop-v}" --notes-file .github/release-notes/desktop.md
        env:
          GH_TOKEN: ${{ github.token }}
